# CICD
name: TripMate AI CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tripemateai-deployment
  cancel-in-progress: false

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================

  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python Syntax
        run: |
          python -m compileall -q app worker scripts

  # ==========================================
  # 2. CONTINUOUS DELIVERY - BUILD AND PUSH ECR
  # ==========================================

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$ECR_REGISTRY"
          test -n "$ECR_REPOSITORY"

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building Docker image..."
          docker build -t "$IMAGE" .

          echo "Pushing image to Amazon ECR..."
          docker push "$IMAGE"

          echo "Docker image pushed successfully"

  # ==========================================
  # 3. CONTINUOUS DEPLOYMENT - EC2
  # ==========================================

  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image

    runs-on: [self-hosted, linux, x64, tripmate-ai-ec2]
    environment: production

    steps:

      # ----------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # CONSTRUCT DOCKER IMAGE URI
      # ----------------------------------------

      - name: Construct ECR Image URI
        id: image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "ECR image URI constructed successfully"

      # ----------------------------------------
      # PULL IMAGE
      # ----------------------------------------

      - name: Pull Docker Image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

      # ----------------------------------------
      # VALIDATE APPLICATION SECRETS
      # ----------------------------------------

      - name: Validate Application Secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DEFAULT_ORIGIN_IATA: ${{ secrets.DEFAULT_ORIGIN_IATA }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}

        run: |
          set -euo pipefail

          REQUIRED=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            DATABASE_URL
            GROQ_API_KEY
            AVIATIONSTACK_API_KEY
            TAVILY_API_KEY
            OPENWEATHER_API_KEY
            DEFAULT_ORIGIN_IATA
            LANGSMITH_TRACING
            LANGSMITH_ENDPOINT
            LANGSMITH_API_KEY
            LANGSMITH_PROJECT
          )

          for name in "${REQUIRED[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Environment Secret: $name"
              exit 1
            fi
          done

          echo "All required application secrets are available"

      # ----------------------------------------
      # STOP EXISTING CONTAINER
      # ----------------------------------------

      - name: Stop Old Container
        run: |
          docker rm -f tripmate-ai || true

      # ----------------------------------------
      # START NEW CONTAINER WITH GITHUB SECRETS
      # ----------------------------------------

      - name: Start New Container
        env:
          IMAGE: ${{ steps.image.outputs.image }}

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DEFAULT_ORIGIN_IATA: ${{ secrets.DEFAULT_ORIGIN_IATA }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}


        run: |
          set -euo pipefail

          docker run -d \
            --name tripmate-ai \
            --restart unless-stopped \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -e DATABASE_URL \
            -e GROQ_API_KEY \
            -e AVIATIONSTACK_API_KEY \
            -e TAVILY_API_KEY \
            -e OPENWEATHER_API_KEY \
            -e DEFAULT_ORIGIN_IATA \
            -e LANGSMITH_TRACING \
            -e LANGSMITH_ENDPOINT \
            -e LANGSMITH_API_KEY \
            -e LANGSMITH_PROJECT \
            -p 8000:8000 \
            "$IMAGE"

      # ----------------------------------------
      # VERIFY DEPLOYMENT
      # ----------------------------------------

      - name: Verify Deployment
        run: |
          set -euo pipefail

          sleep 10

          if ! docker inspect \
            -f '{{.State.Running}}' \
            tripmate-ai | grep -qx true; then

            echo "::error::Container is not running"
            docker logs --tail 100 tripmate-ai
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            http://127.0.0.1:8000/ \
            > /dev/null

          echo "TripMate AI deployed successfully"

      # ----------------------------------------
      # CLEANUP
      # ----------------------------------------

      - name: Clean Unused Docker Images
        run: |
          docker image prune -f