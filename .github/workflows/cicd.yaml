name: TripMate CI/CD

on:
  push:
    branches:
      - TripMate-AI-using-MCP
  pull_request:
    branches:
      - TripMate-AI-using-MCP
  paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tripmate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q app.py backend.py mcp_client.py mcp_client_test.py custom_weather_mcp_server.py test.py tools src

  publish:
    name: Build and publish image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_SECRET_ID: ${{ vars.APP_SECRET_ID }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create application .env from GitHub secrets
        env:
          APP_ENV_FILE: ${{ runner.temp }}/.env
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DEFAULT_ORIGIN_IATA: ${{ secrets.DEFAULT_ORIGIN_IATA }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: |
          set -euo pipefail
          umask 077

          python - <<'PY'
          import os
          from pathlib import Path

          required = (
              "DATABASE_URL",
              "GROQ_API_KEY",
              "AVIATIONSTACK_API_KEY",
              "TAVILY_API_KEY",
          )
          optional = (
              "OPENWEATHER_API_KEY",
              "DEFAULT_ORIGIN_IATA",
              "LANGSMITH_TRACING",
              "LANGSMITH_ENDPOINT",
              "LANGSMITH_API_KEY",
              "LANGSMITH_PROJECT",
          )

          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit(
                  "Missing required GitHub environment secrets: " + ", ".join(missing)
              )

          env_file = Path(os.environ["APP_ENV_FILE"])
          with env_file.open("w", encoding="utf-8") as stream:
              for key in required + optional:
                  value = os.environ.get(key, "")
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"{key} must be a single-line value")
                  if value or key in required:
                      stream.write(f"{key}={value}\n")
          env_file.chmod(0o600)
          PY

      - name: Sync application .env to AWS Secrets Manager
        env:
          APP_ENV_FILE: ${{ runner.temp }}/.env
        run: |
          set -euo pipefail
          aws secretsmanager put-secret-value \
            --secret-id "$APP_SECRET_ID" \
            --secret-string "file://$APP_ENV_FILE" \
            >/dev/null

      - name: Deploy through AWS Systems Manager
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          printf -v DEPLOY_SCRIPT 'set -eu\nexport AWS_REGION=%q\nECR_REGISTRY=%q\nIMAGE_URI=%q\nAPP_SECRET_ID=%q\n' \
            "$AWS_REGION" "$ECR_REGISTRY" "$IMAGE_URI" "$APP_SECRET_ID"
          DEPLOY_SCRIPT+=$'\n'
          DEPLOY_SCRIPT+='
          ENV_FILE=$(mktemp)
          trap '\''rm -f "$ENV_FILE"'\'' EXIT

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker pull "$IMAGE_URI"
          aws secretsmanager get-secret-value \
            --secret-id "$APP_SECRET_ID" \
            --query SecretString \
            --output text > "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          OLD_IMAGE=$(docker inspect --format="{{.Config.Image}}" tripmate 2>/dev/null || true)
          docker rm -f tripmate >/dev/null 2>&1 || true

          if ! docker run -d \
            --name tripmate \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 8000:8000 \
            "$IMAGE_URI"; then
            docker rm -f tripmate >/dev/null 2>&1 || true
            if [ -n "$OLD_IMAGE" ]; then
              docker run -d --name tripmate --restart unless-stopped \
                --env-file "$ENV_FILE" -p 8000:8000 "$OLD_IMAGE"
            fi
            exit 1
          fi

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              echo "TripMate deployment is healthy"
              exit 0
            fi
            sleep 3
          done

          docker logs --tail 100 tripmate || true
          docker rm -f tripmate >/dev/null 2>&1 || true
          if [ -n "$OLD_IMAGE" ]; then
            docker run -d --name tripmate --restart unless-stopped \
              --env-file "$ENV_FILE" -p 8000:8000 "$OLD_IMAGE"
          fi
          exit 1
          '

          PARAMETERS="$(jq -cn --arg script "$DEPLOY_SCRIPT" '{commands: [$script]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy TripMate ${IMAGE_TAG}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true
                echo "::error::Deployment command ended with status $STATUS"
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "::error::Timed out waiting for the EC2 deployment"
          exit 1

      - name: Remove temporary application .env
        if: always()
        env:
          APP_ENV_FILE: ${{ runner.temp }}/.env
        run: rm -f "$APP_ENV_FILE"
